name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Start addon and verify manifest
        shell: bash
        run: |
          npm start > /tmp/mcu-addon.log 2>&1 &
          ADDON_PID=$!
          trap 'kill $ADDON_PID || true; cat /tmp/mcu-addon.log' EXIT
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:7000/manifest.json -o /tmp/manifest.json; then
              break
            fi
            sleep 1
          done
          node -e "const m=require('/tmp/manifest.json'); if(m.id!=='com.freakforest.mcutimeline'||!Array.isArray(m.catalogs)||m.catalogs.length!==4) process.exit(1); console.log('Manifest OK:',m.name,m.version)"
